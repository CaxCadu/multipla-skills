name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck scripts
        run: npm run typecheck
      - name: Validate skills and registry
        run: npm run validate
      - name: Check markdown links
        run: npm run check:links
      - name: Registry index is up to date
        run: npm run check:registry
      - name: Validator self-test
        run: npm run test:validator
      - name: Registry self-test
        run: npm run test:registry
